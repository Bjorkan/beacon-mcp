[project]
name = "beacon-mcp"
version = "2.2.0"
description = "Unofficial read-only MCP gateway to public MeshCore Beacon data"
requires-python = ">=3.13,<3.14"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.28.1,<1",
  "starlette>=0.48,<1",
  "uvicorn>=0.31.1,<1",
  "websockets>=17,<18",
  "pydantic>=2.12,<3",
  "ijson>=3.4,<4",
  "jsonschema>=4.25,<5",
]

[project.scripts]
beacon-mcp = "beacon_mcp.__main__:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beacon_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
    "pyright>=1.1.400,<2",
    "pyyaml>=6,<7",
    "asgi-lifespan>=2.1,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src/beacon_mcp"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
