[package]
name = "beacon-mcp-rust"
version = "2.1.1"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
getrandom = "0.4"
axum = "0.8.9"
bytes = "1"
futures-util = "0.3"
chrono = "0.4"
rmcp = { version = "=3.8.0", features = ["transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = "1"
