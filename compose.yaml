services:
  beacon-mcp:
    image: ${BEACON_MCP_IMAGE:-ghcr.io/bjorkan/beacon-mcp:2.0.2}
    pull_policy: always
    environment:
      BEACON_BASE_URL: ${BEACON_BASE_URL:?Set BEACON_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
