services:
  beacon-mcp:
    image: beacon-mcp:local
    build: .
    environment:
      BEACON_BASE_URL: ${BEACON_BASE_URL:?Set BEACON_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "3000"
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
