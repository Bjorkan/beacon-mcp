name: CI

on:
  push:
    branches: main
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install uv==0.11.29
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests/python
      - run: uv run --locked ruff format --check src tests/python
      - run: uv run --locked pyright
      - run: uv run --locked pytest
      - name: Build Python distribution
        run: uv build --no-sources

  strict-types:
    name: BasedPyright strict (1.39.8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install uv==0.11.29
      - run: uv sync --locked
      - name: Analyze all project Python files with BasedPyright strict
        run: uvx --from basedpyright==1.39.8 basedpyright
      # Temporary diagnostic artifact: removed after local integration review.
      - name: Prepare strict integration review sources
        if: always()
        run: tar --exclude=.git --exclude=.venv --exclude=.pytest_cache -czf /tmp/beacon-source.tar.gz .
      - name: Upload review source bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-source-bundle
          path: /tmp/beacon-source.tar.gz
          retention-days: 1

  # Temporary non-merging preview used to resolve strict diagnostics against
  # the combined pending independent typing PRs. Remove after diagnosis.
  strict-integration-preview:
    name: Temporary full typing integration diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR 95 with complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compose temporary integration of pending PRs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CI Integration Preview"
          git config user.email "ci-preview@invalid.example"
          for pr in 80 81 82 83 84 85 86 87 88 89 90 94; do
            echo "::group::Merge PR $pr into temporary runner checkout"
            git fetch --no-tags origin "refs/pull/$pr/head:refs/remotes/origin/typing-$pr"
            # Prefer each PR's dedicated test edits if a conflict touches
            # the package-qualified fixture imports installed by PR 95.
            git merge --no-ff --no-edit -X theirs "refs/remotes/origin/typing-$pr"
            echo "::endgroup::"
          done
          # Retain the explicit test-package import resolution from PR 95
          # after merging each independently developed test PR.
          sed -i 's/^from conftest import /from tests.python.conftest import /' tests/python/test_*.py
          sed -i 's/^from test_subscriptions import /from tests.python.test_subscriptions import /' tests/python/test_*.py
      - name: Install pinned uv
        run: pipx install uv==0.11.29
      - run: uv sync --locked
      - name: Collect machine-readable full integration diagnostics
        shell: bash
        run: |
          set +e
          uvx --from basedpyright==1.39.8 basedpyright --outputjson > /tmp/strict-integration.json
          status=$?
          set -e
          python - <<'PY'
          import json
          with open("/tmp/strict-integration.json") as stream:
              report = json.load(stream)
          print("Combined strict diagnostics:", report["summary"])
          PY
          echo "Analyzer exit code: $status"
      - name: Bundle integrated review snapshot
        if: always()
        shell: bash
        run: |
          tar --exclude=.git --exclude=.venv --exclude=.pytest_cache -czf /tmp/strict-integrated-source.tar.gz .
      - name: Upload full integration report and source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-integrated-review
          path: |
            /tmp/strict-integration.json
            /tmp/strict-integrated-source.tar.gz
          retention-days: 1

  container:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify hardened container
        run: tests/container/run.sh

  publish-image:
    name: Publish container image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: container
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bjorkan/beacon-mcp
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
