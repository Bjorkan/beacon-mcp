name: CI

on:
  push:
    branches: main
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: pipx install uv==0.11.29
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests/python
      - run: uv run --locked ruff format --check src tests/python
      - run: uv run --locked pyright
      - run: uv run --locked pytest
      - name: Build Python distribution
        run: uv build --no-sources

  strict-types:
    name: BasedPyright strict (1.39.8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository with complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify #95 against the temporary combined typing PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 95 }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CI typing integration"
          git config user.email "ci-typing@invalid.example"
          for pr in 80 81 82 83 84 85 86 87 88 89 90 94; do
            merged_at="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.merged_at // ""')"
            if [[ -n "$merged_at" ]]; then
              echo "PR #$pr is already merged; no temporary merge needed."
              continue
            fi
            git fetch --no-tags origin "refs/pull/$pr/head:refs/remotes/origin/typing-$pr"
            git merge --no-ff --no-edit -X theirs "refs/remotes/origin/typing-$pr"
          done
          # Preserve qualified test-helper imports when independently authored
          # test patches touch the same import block.
          python - <<'PY'
          from pathlib import Path
          for path in Path("tests/python").glob("test_*.py"):
              lines = path.read_text().splitlines(keepends=True)
              seen = set()
              output = []
              for original in lines:
                  line = original.replace(
                      "from conftest import ", "from tests.python.conftest import "
                  ).replace(
                      "from test_subscriptions import ",
                      "from tests.python.test_subscriptions import ",
                  )
                  if line.startswith("from tests.python.conftest import "):
                      if line in seen:
                          continue
                      seen.add(line)
                  output.append(line)
              path.write_text("".join(output))
          PY
      - name: Install pinned uv
        run: pipx install uv==0.11.29
      - run: uv sync --locked
      - name: TEMPORARY produce transitive-locked BasedPyright dev dependency
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 95 }}
        shell: bash
        run: |
          uv add --dev --no-sync 'basedpyright==1.39.8'
          python - <<'PY'
          import json
          from pathlib import Path
          for filename, key in (("pyproject.toml", "project"), ("uv.lock", "lock")):
              data = Path(filename).read_text()
              print("LOCK_BEGIN:" + key)
              for i in range(0, len(data), 1200):
                  print("LOCK_CHUNK:" + key + ":" + str(i) + ":" + json.dumps(data[i:i+1200]))
              print("LOCK_END:" + key)
          PY
      - name: Normalize import blocks after ephemeral test-file merges
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 95 }}
        run: |
          uv run --locked ruff check --select I --fix tests/python
          uv run --locked ruff format tests/python
      - name: Validate integration lint and formatting
        run: |
          uv run --locked ruff check src tests/python
          uv run --locked ruff format --check src tests/python
      - name: Validate integration tests and SDK contracts
        run: uv run --locked pytest
      - name: Analyze all project Python files with BasedPyright strict
        run: uvx --from basedpyright==1.39.8 basedpyright --project basedpyright-config.json

  container:
    name: Container verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify hardened container
        run: tests/container/run.sh

  publish-image:
    name: Publish container image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: container
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/bjorkan/beacon-mcp
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
