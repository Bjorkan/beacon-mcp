name: Check Beacon upstream release

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Compare pinned Beacon release with latest stable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline release-check tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Verify latest published upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream_release.py
